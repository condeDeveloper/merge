name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.so }}

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # O juiz e o git da propria maquina, e a versao dele importa: se um dia o
      # xdiff mudar uma heuristica, e aqui que vai aparecer.
      - name: qual git esta julgando
        run: git --version

      # O `shell: bash` e necessario: no PowerShell do runner do Windows o
      # `testes/*.test.js` chega ao Node como texto literal, e ele procura um
      # arquivo com asterisco no nome. Foi assim que o primeiro CI quebrou em
      # um dos nove jobs -- os oito de Linux e macOS passaram.
      - name: testes
        shell: bash
        run: node --test testes/*.test.js

      - name: o placar
        shell: bash
        run: node ferramentas/placar.js 200
